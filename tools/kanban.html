<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban Board</title>
<style>
  :root {
    --bg: #f4f5f7;
    --header-bg: #ffffff;
    --column-bg: #ebecf0;
    --card-bg: #ffffff;
    --text: #172b4d;
    --text-light: #5e6c84;
    --accent: #0079bf;
    --danger: #eb5a46;
    --border: #dfe1e6;
    --shadow: 0 1px 2px rgba(9,30,66,0.25);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
  }
  .btn {
    border: none;
    border-radius: 4px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
    background: #ebecf0;
    color: var(--text);
    transition: background 0.15s;
  }
  .btn:hover { background: #dcdfe4; }
  .btn.primary {
    background: var(--accent);
    color: white;
  }
  .btn.primary:hover { background: #026aa7; }
  .btn.small {
    padding: 4px 8px;
    font-size: 12px;
  }

  .board {
    flex: 1;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 16px;
    overflow-x: auto;
    overflow-y: hidden;
  }

  .column {
    background: var(--column-bg);
    border-radius: 8px;
    width: 280px;
    min-width: 280px;
    max-height: 100%;
    display: flex;
    flex-direction: column;
  }
  .column-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 10px 6px 12px;
    border-top: 3px solid var(--col-color, var(--accent));
    border-radius: 8px 8px 0 0;
  }
  .column-title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }
  .column-title {
    font-weight: 600;
    font-size: 14px;
    outline: none;
    padding: 4px 6px;
    border-radius: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .column-title:focus {
    background: white;
    box-shadow: inset 0 0 0 2px var(--accent);
  }
  .card-count {
    background: rgba(9,30,66,0.13);
    color: var(--text-light);
    border-radius: 10px;
    padding: 1px 8px;
    font-size: 12px;
    flex-shrink: 0;
  }
  .column-delete {
    background: none;
    border: none;
    color: var(--text-light);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
    border-radius: 3px;
    line-height: 1;
    flex-shrink: 0;
  }
  .column-delete:hover {
    background: rgba(9,30,66,0.13);
    color: var(--danger);
  }

  .cards {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px;
    min-height: 20px;
  }

  .card {
    background: var(--card-bg);
    border-radius: 5px;
    box-shadow: var(--shadow);
    padding: 8px 30px 8px 10px;
    margin-bottom: 8px;
    font-size: 14px;
    line-height: 1.4;
    position: relative;
    cursor: grab;
    word-wrap: break-word;
    outline: none;
  }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: 0.4; }
  .card[contenteditable="true"] {
    box-shadow: 0 0 0 2px var(--accent);
    cursor: text;
  }
  .card-delete {
    position: absolute;
    top: 6px;
    right: 6px;
    background: none;
    border: none;
    color: var(--text-light);
    font-size: 15px;
    cursor: pointer;
    padding: 2px 5px;
    border-radius: 3px;
    line-height: 1;
    opacity: 0;
    transition: opacity 0.1s;
  }
  .card:hover .card-delete { opacity: 1; }
  .card-delete:hover {
    background: rgba(9,30,66,0.13);
    color: var(--danger);
  }

  .drop-indicator {
    height: 3px;
    background: var(--accent);
    border-radius: 2px;
    margin: 0 8px 8px 8px;
  }

  .add-card-area { padding: 4px 8px 10px 8px; }
  .add-card-btn {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--text-light);
    padding: 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }
  .add-card-btn:hover {
    background: rgba(9,30,66,0.08);
    color: var(--text);
  }
  .add-card-form textarea {
    width: 100%;
    border: none;
    border-radius: 5px;
    box-shadow: var(--shadow);
    padding: 8px;
    font-family: inherit;
    font-size: 14px;
    resize: none;
    min-height: 50px;
    outline: none;
  }
  .add-card-form .row {
    display: flex;
    gap: 8px;
    margin-top: 6px;
    align-items: center;
  }
  .cancel-link {
    color: var(--text-light);
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
    padding: 0 4px;
  }
  .cancel-link:hover { color: var(--danger); }

  .add-column-wrap {
    width: 280px;
    min-width: 280px;
    flex-shrink: 0;
  }
  .add-column-wrap > .btn {
    width: 100%;
    text-align: left;
    background: rgba(0,0,0,0.04);
  }
  .add-column-form {
    background: var(--column-bg);
    border-radius: 8px;
    padding: 10px;
  }
  .add-column-form input {
    width: 100%;
    border: none;
    border-radius: 5px;
    box-shadow: var(--shadow);
    padding: 8px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }
  .add-column-form .row {
    display: flex;
    gap: 8px;
    margin-top: 6px;
    align-items: center;
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(9,30,66,0.2); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1>📋 Kanban Board</h1>
  <button class="btn" id="resetBtn" title="Clear everything and start over">Reset Board</button>
</header>

<div class="board" id="board"></div>

<script>
(function () {
  const STORAGE_KEY = 'kanban-board-data-v1';
  const COLORS = ['#0079bf', '#d29034', '#519839', '#b04632', '#89609e', '#00aecc', '#8eb21c'];

  const defaultState = {
    columns: [
      { id: uid(), title: 'To Do', colorIndex: 0, cards: [
        { id: uid(), text: 'Welcome! Drag cards between columns.' },
        { id: uid(), text: 'Double-click a card to edit it.' }
      ]},
      { id: uid(), title: 'In Progress', colorIndex: 1, cards: [] },
      { id: uid(), title: 'Done', colorIndex: 2, cards: [] }
    ]
  };

  let state = loadState();

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { console.warn('Could not load saved board, starting fresh.', e); }
    return structuredClone ? structuredClone(defaultState) : JSON.parse(JSON.stringify(defaultState));
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  const board = document.getElementById('board');

  function render() {
    board.innerHTML = '';
    state.columns.forEach(col => board.appendChild(renderColumn(col)));
    board.appendChild(renderAddColumn());
  }

  function renderColumn(col) {
    const colEl = document.createElement('div');
    colEl.className = 'column';
    colEl.dataset.colId = col.id;
    colEl.style.setProperty('--col-color', COLORS[col.colorIndex % COLORS.length]);

    // Header
    const header = document.createElement('div');
    header.className = 'column-header';

    const titleRow = document.createElement('div');
    titleRow.className = 'column-title-row';

    const title = document.createElement('div');
    title.className = 'column-title';
    title.contentEditable = 'true';
    title.spellcheck = false;
    title.textContent = col.title;
    title.addEventListener('blur', () => {
      col.title = title.textContent.trim() || 'Untitled';
      title.textContent = col.title;
      saveState();
    });
    title.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); title.blur(); }
    });

    const count = document.createElement('span');
    count.className = 'card-count';
    count.textContent = col.cards.length;

    titleRow.appendChild(title);
    titleRow.appendChild(count);

    const delBtn = document.createElement('button');
    delBtn.className = 'column-delete';
    delBtn.innerHTML = '&times;';
    delBtn.title = 'Delete column';
    delBtn.addEventListener('click', () => {
      if (col.cards.length === 0 || confirm(`Delete column "${col.title}" and its ${col.cards.length} card(s)?`)) {
        state.columns = state.columns.filter(c => c.id !== col.id);
        saveState();
        render();
      }
    });

    header.appendChild(titleRow);
    header.appendChild(delBtn);

    // Cards list
    const cardsEl = document.createElement('div');
    cardsEl.className = 'cards';
    cardsEl.dataset.colId = col.id;

    col.cards.forEach(card => cardsEl.appendChild(renderCard(col, card)));

    cardsEl.addEventListener('dragover', e => {
      e.preventDefault();
      const dragging = document.querySelector('.card.dragging');
      if (!dragging) return;
      const after = getDragAfterElement(cardsEl, e.clientY);
      if (after == null) {
        cardsEl.appendChild(dragging);
      } else {
        cardsEl.insertBefore(dragging, after);
      }
    });

    cardsEl.addEventListener('drop', e => {
      e.preventDefault();
      syncOrderFromDOM();
      saveState();
      render();
    });

    // Add-card area
    const addArea = document.createElement('div');
    addArea.className = 'add-card-area';
    addArea.appendChild(renderAddCardControl(col));

    colEl.appendChild(header);
    colEl.appendChild(cardsEl);
    colEl.appendChild(addArea);
    return colEl;
  }

  function renderCard(col, card) {
    const cardEl = document.createElement('div');
    cardEl.className = 'card';
    cardEl.draggable = true;
    cardEl.dataset.cardId = card.id;
    cardEl.dataset.colId = col.id;
    cardEl.textContent = card.text;

    cardEl.addEventListener('dragstart', () => {
      cardEl.classList.add('dragging');
    });
    cardEl.addEventListener('dragend', () => {
      cardEl.classList.remove('dragging');
      syncOrderFromDOM();
      saveState();
      render();
    });

    cardEl.addEventListener('dblclick', () => {
      cardEl.contentEditable = 'true';
      cardEl.focus();
      document.execCommand('selectAll', false, null);
    });

    cardEl.addEventListener('blur', () => {
      if (cardEl.isContentEditable) {
        cardEl.contentEditable = 'false';
        const newText = cardEl.textContent.trim();
        if (newText) {
          card.text = newText;
        } else {
          // empty card text -> remove it
          col.cards = col.cards.filter(c => c.id !== card.id);
          render();
        }
        saveState();
      }
    });

    cardEl.addEventListener('keydown', e => {
      if (cardEl.isContentEditable && e.key === 'Enter') {
        e.preventDefault();
        cardEl.blur();
      }
      if (e.key === 'Escape') {
        cardEl.textContent = card.text;
        cardEl.blur();
      }
    });

    const delBtn = document.createElement('button');
    delBtn.className = 'card-delete';
    delBtn.innerHTML = '&times;';
    delBtn.title = 'Delete card';
    delBtn.addEventListener('click', e => {
      e.stopPropagation();
      col.cards = col.cards.filter(c => c.id !== card.id);
      saveState();
      render();
    });
    cardEl.appendChild(delBtn);

    return cardEl;
  }

  function renderAddCardControl(col) {
    const wrap = document.createElement('div');

    function showButton() {
      wrap.innerHTML = '';
      const btn = document.createElement('button');
      btn.className = 'add-card-btn';
      btn.textContent = '+ Add a card';
      btn.addEventListener('click', showForm);
      wrap.appendChild(btn);
    }

    function showForm() {
      wrap.innerHTML = '';
      const form = document.createElement('div');
      form.className = 'add-card-form';

      const textarea = document.createElement('textarea');
      textarea.placeholder = 'Enter a title for this card...';

      const row = document.createElement('div');
      row.className = 'row';

      const addBtn = document.createElement('button');
      addBtn.className = 'btn primary small';
      addBtn.textContent = 'Add card';
      addBtn.addEventListener('click', submit);

      const cancel = document.createElement('span');
      cancel.className = 'cancel-link';
      cancel.innerHTML = '&times;';
      cancel.addEventListener('click', showButton);

      row.appendChild(addBtn);
      row.appendChild(cancel);
      form.appendChild(textarea);
      form.appendChild(row);
      wrap.appendChild(form);
      textarea.focus();

      textarea.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          submit();
        } else if (e.key === 'Escape') {
          showButton();
        }
      });

      function submit() {
        const text = textarea.value.trim();
        if (text) {
          col.cards.push({ id: uid(), text });
          saveState();
          render();
        } else {
          showButton();
        }
      }
    }

    showButton();
    return wrap;
  }

  function renderAddColumn() {
    const wrap = document.createElement('div');
    wrap.className = 'add-column-wrap';

    function showButton() {
      wrap.innerHTML = '';
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.textContent = '+ Add another column';
      btn.addEventListener('click', showForm);
      wrap.appendChild(btn);
    }

    function showForm() {
      wrap.innerHTML = '';
      const form = document.createElement('div');
      form.className = 'add-column-form';

      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'Enter column name...';

      const row = document.createElement('div');
      row.className = 'row';

      const addBtn = document.createElement('button');
      addBtn.className = 'btn primary small';
      addBtn.textContent = 'Add column';
      addBtn.addEventListener('click', submit);

      const cancel = document.createElement('span');
      cancel.className = 'cancel-link';
      cancel.innerHTML = '&times;';
      cancel.addEventListener('click', showButton);

      row.appendChild(addBtn);
      row.appendChild(cancel);
      form.appendChild(input);
      form.appendChild(row);
      wrap.appendChild(form);
      input.focus();

      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); submit(); }
        else if (e.key === 'Escape') { showButton(); }
      });

      function submit() {
        const text = input.value.trim();
        if (text) {
          state.columns.push({ id: uid(), title: text, colorIndex: state.columns.length, cards: [] });
          saveState();
          render();
        } else {
          showButton();
        }
      }
    }

    showButton();
    return wrap;
  }

  function getDragAfterElement(container, y) {
    const els = [...container.querySelectorAll('.card:not(.dragging)')];
    return els.reduce((closest, child) => {
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) {
        return { offset, element: child };
      }
      return closest;
    }, { offset: Number.NEGATIVE_INFINITY }).element;
  }

  // Reconstructs state.columns[*].cards order/membership based on current DOM order
  function syncOrderFromDOM() {
    const cardLookup = {};
    state.columns.forEach(col => col.cards.forEach(card => cardLookup[card.id] = card));

    document.querySelectorAll('.cards').forEach(cardsEl => {
      const colId = cardsEl.dataset.colId;
      const col = state.columns.find(c => c.id === colId);
      if (!col) return;
      const newCards = [];
      cardsEl.querySelectorAll('.card').forEach(cardEl => {
        const card = cardLookup[cardEl.dataset.cardId];
        if (card) newCards.push(card);
      });
      col.cards = newCards;
    });
  }

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (confirm('This will delete all columns and cards. Continue?')) {
      state = structuredClone ? structuredClone(defaultState) : JSON.parse(JSON.stringify(defaultState));
      // give fresh ids so it doesn't collide with anything
      state.columns.forEach(c => { c.id = uid(); c.cards.forEach(cd => cd.id = uid()); });
      saveState();
      render();
    }
  });

  render();
})();
</script>

</body>
</html>
